    <meta property="og:title" content="Stitchnook — free cross-stitch pattern maker" />

      property="og:description"
      content="Design cross-stitch charts, convert photos, full DMC catalogue, print to PDF. Free, no account."
    />
    <meta property="og:url" content="https://stitchnook.github.io/" />
    <meta property="og:image" content="https://stitchnook.github.io/og.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Stitchnook",
        "url": "https://stitchnook.github.io/",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Any (web browser)",
        "inLanguage": ["en", "fr", "es", "de"],
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
        "description": "Free cross-stitch pattern maker: draw charts, convert photos and PDFs, full DMC catalogue, progress tracking, print to PDF."
      }
    </script>

    <script>
      // Apply the saved theme before the first paint (see src/hooks/useTheme.ts).
      try {
        var saved = localStorage.getItem('stitchly.theme.v1')
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
      // Offline support and installation (web only: the desktop app has its own files).
      if ('serviceWorker' in navigator && location.protocol === 'https:') {
        addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js').catch(function () {})
        })
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>Stitchnook — free cross-stitch pattern maker</h1>
      <p>
        Draw cross-stitch charts, turn photos and PDFs into patterns, pick threads from the full DMC catalogue, track
        your progress and print your pattern or save it as PDF. Free, no account, everything stays in your browser.
        JavaScript is required to run the editor.
      </p>
      <p><a href="./en/">About Stitchnook</a> · <a href="./fr/">Français</a> · <a href="./es/">Español</a> · <a href="./de/">Deutsch</a></p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
